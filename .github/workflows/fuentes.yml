name: Fuentes locales
on: workflow_dispatch
permissions:
  contents: write
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descargar fuentes
        run: |
          mkdir -p media/fonts && cd media/fonts
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120 Safari/537.36"
          curl -s -A "$UA" "https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" -o all.css
          python3 - <<'P'
          import re,urllib.request
          css=open('all.css').read()
          out=[]
          for blk in re.findall(r'/\* ([a-z-]+) \*/\s*(@font-face\s*\{.*?\})',css,re.S):
              sub,b=blk
              if sub not in('latin','latin-ext'): continue
              fam=re.search(r"font-family: '([^']+)'",b).group(1)
              w=re.search(r'font-weight: (\d+)',b).group(1)
              url=re.search(r'url\((https[^)]+)\)',b).group(1)
              name=fam.lower().replace(' ','-')+'-'+w+'-'+sub+'.woff2'
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 Chrome/120'})
              open(name,'wb').write(urllib.request.urlopen(req).read())
              ur=re.search(r'unicode-range: ([^;]+);',b).group(1)
              out.append("@font-face{font-family:'%s';font-style:normal;font-weight:%s;font-display:swap;src:url(media/fonts/%s) format('woff2');unicode-range:%s}"%(fam,w,name,ur))
          open('fonts.css','w').write('\n'.join(out))
          P
          rm all.css; ls -la
      - name: Commit
        run: |
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git add media/fonts; git commit -m "Fuentes alojadas en el repositorio" || true
          git push
