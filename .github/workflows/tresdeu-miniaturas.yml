# Descarga la imagen principal de cada artículo de tresdeu.com y guarda una miniatura propia en media/tresdeu/.
# Se ejecuta a mano (Actions → Miniaturas de Tresdeu → Run workflow).
name: Miniaturas de Tresdeu

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  miniaturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear miniaturas
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import json, os, io, urllib.request, urllib.parse
          from PIL import Image, ImageOps
          src = json.load(open('.github/tresdeu-fuentes.json', encoding='utf-8'))
          os.makedirs('media/tresdeu', exist_ok=True)
          W, H = 640, 480
          ok, fail = 0, []
          for a in src:
              url = 'https://www.tresdeu.com/wp-content/uploads/' + urllib.parse.quote(a['img'], safe='/')
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (portfolio thumbnail builder)'})
                  data = urllib.request.urlopen(req, timeout=40).read()
                  im = Image.open(io.BytesIO(data))
                  im = ImageOps.exif_transpose(im).convert('RGB')
                  im = ImageOps.fit(im, (W, H), Image.LANCZOS, centering=(0.5, 0.4))
                  im.save('media/tresdeu/%s.webp' % a['slug'], 'WEBP', quality=80, method=6)
                  ok += 1
              except Exception as e:
                  fail.append((a['slug'], str(e)[:120]))
          print('OK', ok, 'FALLOS', len(fail))
          for f in fail: print('  -', f)
          PY
      - name: Guardar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/tresdeu
          if git diff --cached --quiet; then echo "Nada que guardar"; else
            git commit -m "Tresdeu: miniaturas de los artículos"
            git pull --rebase --autostash origin main
            git push
          fi
